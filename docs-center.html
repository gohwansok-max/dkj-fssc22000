<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>문서센터 | 동김제농협 가공센터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dkj-tokens.css?v=16">
  <link rel="stylesheet" href="css/dkj-hub.css?v=16">
  <link rel="manifest" href="manifest.json?v=16">
</head>
<body class="hub-page">

  <header class="ck-header">
    <a class="ck-brand" href="index.html" aria-label="업무 콘솔로">
      <img class="ck-symbol" src="assets/brand/nh-symbol.svg" alt="농협"
           onerror="this.outerHTML='&lt;div class=\'ck-symbol-fallback\'&gt;NH&lt;/div&gt;'">
      <div class="ck-title">
        <strong>동김제농협 가공센터</strong>
        <span>스마트 HACCP · FSSC22000 V6</span>
      </div>
    </a>

    <nav class="gnb" id="gnb" data-dkj-nav data-active="docs" data-base="" aria-label="주요 메뉴"></nav>

    <div class="ck-header-right">
      <a class="ck-hbtn" href="index.html">업무 콘솔</a>
      <a class="ck-hbtn" href="records-center.html">기록 목록</a>
      <a class="ck-hbtn" href="records-archive.html">기록보관함</a>
      <a class="ck-hbtn on" href="docs-center.html" aria-current="page">문서센터</a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="gnb">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="ck-main">

    <div class="hub-head">
      <div class="hub-head-main">
        <h1>문서센터</h1>
        <p>통합매뉴얼 · 절차서 · PRP · SOP · HACCP · 교육 · 심사 — 최종본260714 · MDR Rev11</p>
      </div>
      <div class="docs-status-row" id="docsStatusRow" aria-label="문서 진행 현황"></div>
    </div>

    <div class="hub-layout">
      <aside class="docs-sidebar" id="docsSidebar" aria-label="문서 카테고리"></aside>

      <section class="docs-main" aria-labelledby="categoryHead">
        <div id="categoryHead"></div>

        <div class="docs-toolbar">
          <input type="search" class="docs-search" id="docSearch" placeholder="문서번호·제목·태그 검색…" aria-label="문서 검색">
          <select class="docs-filter" id="docStatusFilter" aria-label="진행상태 필터">
            <option value="all">전체 상태</option>
            <option value="완료">완료</option>
            <option value="수정필요">수정필요</option>
          </select>
          <a class="pill-btn ghost" href="mdr-register.html">MDR 등록대장</a>
        </div>

        <p class="docs-count" id="docCount">불러오는 중…</p>
        <div class="doc-list" id="docList" role="list"></div>
      </section>
    </div>

  </main>

  <script src="js/dkj-firebase-config.js?v=16"></script>
  <script src="js/dkj-auth.js?v=16"></script>
  <script src="js/dkj-cloud-sync.js?v=16"></script>
  <script src="js/doc-catalog.bundle.js?v=16"></script>
  <script src="js/menu-catalog.bundle.js?v=16"></script>
  <script src="js/dkj-links.js?v=16"></script>
  <script src="js/dkj-nav.js?v=16"></script>
  <script src="js/docs-center.js?v=16"></script>
  <script src="js/dkj-pwa.js?v=16"></script>

</html>
