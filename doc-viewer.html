<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>문서 열람 | 동김제농협</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dkj-tokens.css?v=47">
  <link rel="stylesheet" href="css/dkj-hub.css?v=47">
  <link rel="manifest" href="manifest.json?v=47">
</head>
<body class="hub-page">

  <header class="ck-header">
    <a class="ck-brand" href="index.html" aria-label="업무 콘솔로">
      <span class="ck-wordmark">
        <img class="ck-wordmark-symbol" src="assets/brand/nh-symbol.svg" alt="">
        <span class="ck-wordmark-name"><b>동김제농협</b><b>산지유통센터</b></span>
      </span>
      <span class="ck-tagline">스마트 HACCP · FSSC22000 V6</span>
    </a>

    <nav class="gnb" id="gnb" data-dkj-nav data-active="docs" data-base="" aria-label="주요 메뉴"></nav>

    <div class="ck-header-right">
      <a class="ck-hbtn" href="index.html">업무 콘솔</a>
      <a class="ck-hbtn" href="docs-center.html">문서센터</a>
      <a class="ck-hbtn" href="records-archive.html">기록보관함</a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="gnb">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <section class="viewer-top">
    <div class="container">
      <div class="viewer-meta" id="viewerMeta">
        <h1>문서 불러오는 중…</h1>
      </div>
      <div class="viewer-actions">
        <a class="pill-btn ghost" href="docs-center.html">← 목록</a>
        <a class="pill-btn ghost" href="records-center.html" id="btnRecords">기록양식</a>
        <button type="button" class="pill-btn green" id="btnPrintPdf" hidden>정본 PDF 인쇄</button>
      </div>
    </div>
  </section>

  <main class="container viewer-body" id="viewerBody">
    <p style="color:var(--ink-3);">카탈로그에서 문서 정보를 읽는 중입니다.</p>
  </main>

  <script src="js/dkj-util.js?v=47"></script>
  <script src="js/dkj-firebase-config.js?v=47"></script>
  <script src="js/dkj-auth.js?v=47"></script>
  <script src="js/dkj-cloud-sync.js?v=47"></script>
  <script src="js/doc-assets.bundle.js?v=47"></script>
  <script src="js/doc-catalog.bundle.js?v=47"></script>
  <script src="js/dkj-links.js?v=47"></script>
  <script src="js/menu-catalog.bundle.js?v=47"></script>
  <script src="js/dkj-nav.js?v=47"></script>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var docId = params.get('id');
      var metaEl = document.getElementById('viewerMeta');
      var bodyEl = document.getElementById('viewerBody');
      var activeTab = params.get('tab') || 'summary';

      if (!docId) {
        metaEl.innerHTML = '<h1>문서를 지정해 주세요</h1>';
        bodyEl.innerHTML = '<a class="pill-btn green" href="docs-center.html">문서센터로</a>';
        return;
      }

      function statusClass(s) {
        return s === '완료' ? 'done' : 'wip';
      }

      function setTab(tab) {
        activeTab = tab;
        bodyEl.querySelectorAll('.viewer-tab-panel').forEach(function (p) {
          p.hidden = p.getAttribute('data-tab') !== tab;
        });
        bodyEl.querySelectorAll('.viewer-tab').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-tab') === tab);
        });
      }

      function render(doc) {
        document.title = doc.code + ' ' + doc.title + ' | 동김제농협';
        var st = statusClass(doc.workflowStatus);
        metaEl.innerHTML =
          '<h1><span class="doc-code">' + doc.code + '</span> ' + doc.title + '</h1>' +
          '<p>' + doc.rev + ' · <span class="badge ' + st + '">' + doc.workflowStatus + '</span> · ' +
          (doc.fileType || 'file').toUpperCase() + '</p>';

        var highlights = (doc.highlights || []).map(function (h) {
          return '<li>' + h + '</li>';
        }).join('');

        var notice = doc.workflowStatus === '수정필요'
          ? '<div class="viewer-notice">⚠️ 개정 작업 중 — 참고용 요약입니다.</div>'
          : '<div class="viewer-notice ok">✓ MDR-001 <strong>' + (doc.mdrRev || 'Rev4') + '</strong> · ' + (doc.mdrStatus || '운영중') + '</div>';
        if (doc.code === 'MDR-001') {
          notice += '<p style="margin-top:10px;"><a class="pill-btn green" href="mdr-register.html">MDR Rev4 전체 등록대장 →</a></p>';
        }

        bodyEl.innerHTML =
          '<div class="viewer-tabs" role="tablist">' +
            '<button type="button" class="viewer-tab active" data-tab="summary" role="tab">요약</button>' +
            '<button type="button" class="viewer-tab" data-tab="pdf" role="tab">PDF 정본</button>' +
            '<button type="button" class="viewer-tab" data-tab="forms" role="tab">관련 기록양식</button>' +
          '</div>' +
          '<section class="viewer-tab-panel" data-tab="summary">' +
            '<div class="viewer-panel"><h2>핵심 포인트</h2><ul class="highlight-list">' + highlights + '</ul></div>' +
            '<div class="viewer-panel"><h2>문서 요약</h2><div class="viewer-excerpt" id="excerptText">…</div>' + notice + '</div>' +
          '</section>' +
          '<section class="viewer-tab-panel" data-tab="pdf" hidden>' +
            '<div class="viewer-panel" id="pdfPanel"><p>PDF 확인 중…</p></div>' +
          '</section>' +
          '<section class="viewer-tab-panel" data-tab="forms" hidden>' +
            '<div class="viewer-panel"><h2>이 절차서에서 사용하는 FR 양식</h2><div class="link-chip-row" id="relatedForms">…</div>' +
            '<p style="margin-top:14px;"><a class="pill-btn blue" href="records-center.html?procedure=' + encodeURIComponent(doc.id) + '">관련 FR만 보기 →</a></p></div>' +
          '</section>';

        bodyEl.querySelectorAll('.viewer-tab').forEach(function (btn) {
          btn.addEventListener('click', function () { setTab(btn.getAttribute('data-tab')); });
        });
        setTab(activeTab);

        if (doc.excerpt) {
          fetch(doc.excerpt).then(function (r) { return r.text(); }).then(function (text) {
            document.getElementById('excerptText').textContent = text;
          }).catch(fallbackExcerpt);
        } else {
          fallbackExcerpt();
        }

        function fallbackExcerpt() {
          document.getElementById('excerptText').textContent =
            (doc.highlights || []).join('\n· ') || '요약본 준비 중';
        }

        Promise.all([
          DkjLinks.getPdfPath(doc.id, doc.code),
          DkjLinks.driveDocumentFor ? DkjLinks.driveDocumentFor(doc.id, doc.code) : Promise.resolve(null)
        ]).then(function (res) {
          var pdf = res[0];
          var driveDoc = res[1];
          var panel = document.getElementById('pdfPanel');
          var btnPrint = document.getElementById('btnPrintPdf');
          var sourceDownload = driveDoc && driveDoc.downloadUrl ?
            '<a class="pill-btn ghost" href="' + driveDoc.downloadUrl + '" target="_blank" rel="noopener">원본 다운로드</a> ' : '';
          if (pdf) {
            panel.innerHTML =
              '<div class="viewer-notice ok" style="margin:0 0 12px;">' +
              '✓ <strong>Google Drive PDF 정본 연결됨</strong> · 인쇄는 PDF 정본을 사용하세요.' +
              '</div>' +
              '<div class="pdf-toolbar">' +
                '<a class="pill-btn ghost" href="' + pdf + '" target="_blank" rel="noopener">PDF 새 탭 열기</a> ' + sourceDownload +
                '<button type="button" class="pill-btn green" id="btnPdfPrintInline">정본 PDF 인쇄</button>' +
              '</div>' +
              '<iframe class="pdf-frame" id="pdfFrame" src="' + pdf + '" title="PDF ' + doc.code + '"></iframe>';
            if (btnPrint) {
              btnPrint.hidden = false;
              btnPrint.onclick = function () { printPdf(pdf); };
            }
            var inline = document.getElementById('btnPdfPrintInline');
            if (inline) inline.onclick = function () { printPdf(pdf); };
          } else if (driveDoc) {
            panel.innerHTML =
              '<div class="viewer-notice ok" style="margin:0 0 12px;">' +
              '✓ <strong>Google Drive 원본 연결됨</strong> · PDF 정본이 아직 연결되지 않아 원본을 열람합니다.' +
              '</div>' +
              '<div class="pdf-toolbar">' +
                '<a class="pill-btn ghost" href="' + driveDoc.viewUrl + '" target="_blank" rel="noopener">원본 새 탭 열기</a> ' +
                '<a class="pill-btn ghost" href="' + driveDoc.downloadUrl + '" target="_blank" rel="noopener">원본 다운로드</a> ' +
                '<button type="button" class="pill-btn green" id="btnDrivePrintInline">원본 인쇄</button>' +
              '</div>' +
              '<iframe class="pdf-frame" id="pdfFrame" src="' + driveDoc.previewUrl + '" title="원본 ' + doc.code + '"></iframe>';
            if (btnPrint) {
              btnPrint.hidden = false;
              btnPrint.textContent = '원본 인쇄';
              btnPrint.onclick = function () { printPdf(driveDoc.viewUrl); };
            }
            var drivePrint = document.getElementById('btnDrivePrintInline');
            if (drivePrint) drivePrint.onclick = function () { printPdf(driveDoc.viewUrl); };
          } else {
            panel.innerHTML =
              '<div class="viewer-notice">' +
              '📄 연결된 PDF 또는 Drive 원본이 없습니다. 정본 열람실에서 전체 문서를 검색하거나 문서관리 담당자에게 확인하세요.<br><br>' +
              '<a class="pill-btn green" href="official-documents.html">정본 문서 열람실 열기</a>' +
              '</div>';
            if (btnPrint) btnPrint.hidden = true;
          }
          // 절차서·기준서·SOP는 PDF 또는 Drive 원본 탭을 기본으로 연다.
          var cat = (doc.category || doc.menuGroup || '').toLowerCase();
          var code = (doc.code || '').toUpperCase();
          if ((pdf || driveDoc) && !params.get('tab') && (
            code.indexOf('DKJ-P') === 0 || code.indexOf('PRP') === 0 ||
            code.indexOf('DKJ-W') === 0 || code.indexOf('DKJ-M') === 0 ||
            cat.indexOf('절차') >= 0 || cat.indexOf('sop') >= 0
          )) {
            setTab('pdf');
          }
        });

        function printPdf(pdfUrl) {
          var w = window.open(pdfUrl, '_blank');
          if (!w) {
            alert('팝업이 차단되었습니다. PDF를 새 탭에서 연 뒤 Ctrl+P로 인쇄하세요.');
            return;
          }
          setTimeout(function () {
            try { w.focus(); w.print(); } catch (e) { /* user prints manually */ }
          }, 800);
        }
        DkjLinks.recordsForProcedure(doc.id).then(function (records) {
          var el = document.getElementById('relatedForms');
          el.innerHTML = DkjLinks.renderLinkChips(records,
            function (r) {
              return r.htmlReady ? r.htmlPath : 'record-viewer.html?id=' + encodeURIComponent(r.id);
            },
            function (r) {
              return r.code + (r.htmlReady ? ' ✎' : '') + ' ' + r.title;
            });
          var btn = document.getElementById('btnRecords');
          if (btn && records.length) {
            btn.href = 'records-center.html?procedure=' + encodeURIComponent(doc.id);
          }
        });
      }

      DkjLinks.loadDocs().then(function (catalog) {
        var doc = (catalog.documents || []).find(function (d) {
          return d.id === docId || d.code === docId;
        });
        if (!doc) {
          doc = {
            id: docId,
            code: docId,
            title: 'MDR 연계 문서',
            rev: 'MDR 기준',
            workflowStatus: '완료',
            fileType: 'docx',
            mdrRev: 'Rev11',
            mdrStatus: '운영중',
            highlights: ['MDR 등록대장에서 연결된 문서입니다.'],
            excerpt: null
          };
        }
        render(doc);
      }).catch(function (err) {
        console.error(err);
        metaEl.innerHTML = '<h1>문서를 불러오지 못했습니다</h1>';
        bodyEl.innerHTML =
          '<div class="viewer-notice">카탈로그 로드 실패 (file:// 제한일 수 있습니다).<br>' +
          '페이지를 <strong>새로고침(Ctrl+F5)</strong> 하거나 <code>run_server.bat</code>로 여세요.</div>' +
          '<p style="margin-top:12px;"><a class="pill-btn green" href="docs-center.html">문서센터</a> ' +
          '<a class="pill-btn blue" href="mdr-register.html">MDR</a></p>';
      });
    })();
  </script>
  <script src="js/dkj-pwa.js?v=47"></script>
</body>
</html>
