<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>기록양식 상세 | 동김제농협</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dkj-tokens.css?v=23">
  <link rel="stylesheet" href="css/dkj-hub.css?v=23">
  <link rel="manifest" href="manifest.json?v=23">
</head>
<body class="hub-page">

  <header class="ck-header">
    <a class="ck-brand" href="index.html" aria-label="업무 콘솔로">
      <span class="ck-wordmark">
        <img class="ck-wordmark-symbol" src="assets/brand/nh-symbol.svg" alt="">
        <span class="ck-wordmark-name"><b>동김제농협</b><b>산지유통센터</b></span>
      </span>
      <span class="ck-tagline">스마트 HACCP · FSSC22000 V6</span>
    </a>
    <div class="ck-header-right">
      <a class="ck-hbtn" href="index.html">업무 콘솔</a>
      <a class="ck-hbtn" href="records-center.html">기록 목록</a>
      <a class="ck-hbtn" href="records-archive.html">기록보관함</a>
      <a class="ck-hbtn" href="docs-center.html">문서센터</a>
    </div>
  </header>

  <section class="viewer-top">
    <div class="container">
      <div class="viewer-meta" id="viewerMeta"><h1>불러오는 중…</h1></div>
      <div class="viewer-actions">
        <a class="pill-btn ghost" href="records-center.html">← FR 목록</a>
        <a class="pill-btn ghost" href="docs-center.html">문서센터</a>
      </div>
    </div>
  </section>
  <main class="container viewer-body" id="viewerBody"></main>

  <script src="js/dkj-firebase-config.js?v=23"></script>
  <script src="js/dkj-auth.js?v=23"></script>
  <script src="js/dkj-cloud-sync.js?v=23"></script>
  <script src="js/record-catalog.bundle.js?v=23"></script>
  <script src="js/dkj-links.js?v=23-3"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get('id');
      var meta = document.getElementById('viewerMeta');
      var body = document.getElementById('viewerBody');

      if (!id) {
        meta.innerHTML = '<h1>양식 ID 필요</h1>';
        body.innerHTML = '<a class="pill-btn blue" href="records-center.html">목록으로</a>';
        return;
      }

      DkjLinks.loadRecords().then(function (cat) {
        var rec = cat.records.find(function (r) { return r.id === id; });
        if (!rec) {
          meta.innerHTML = '<h1>양식 없음</h1><p>' + id + '</p>';
          return;
        }
        document.title = rec.code + ' ' + rec.title;
        meta.innerHTML = '<h1><span class="doc-code">' + rec.code + '</span> ' + rec.title + '</h1>' +
          '<p>' + rec.rev + ' · ' + rec.frequency + ' · ' + rec.fileType.toUpperCase() + '</p>';

        return Promise.all([
          DkjLinks.proceduresForRecord(id),
          DkjLinks.sopsForRecord(id)
        ]).then(function (res) {
          var procs = res[0];
          var sops = res[1];
          var procLinks = DkjLinks.renderLinkChips(procs,
            function (d) { return 'doc-viewer.html?id=' + encodeURIComponent(d.id); },
            function (d) { return d.code + ' ' + d.title; });
          var sopLinks = DkjLinks.renderLinkChips(sops,
            function (d) { return 'doc-viewer.html?id=' + encodeURIComponent(d.id); },
            function (d) { return d.code; });

          body.innerHTML =
            '<section class="viewer-panel"><h2>연결 절차서</h2><div class="link-chip-row">' + procLinks + '</div></section>' +
            (sops.length ? '<section class="viewer-panel"><h2>연결 SOP</h2><div class="link-chip-row">' + sopLinks + '</div></section>' : '') +
            (rec.htmlReady
              ? '<section class="viewer-panel" style="background:var(--st-done-bg);border-color:var(--st-done-line);">' +
                '<h2>태블릿 작성 (HTML)</h2>' +
                '<p style="margin:0 0 12px;line-height:1.6;">이 양식은 <strong>HTML 기록</strong>으로 작성할 수 있습니다.</p>' +
                '<a class="pill-btn green" href="' + rec.htmlPath + '">지금 작성하기 →</a>' +
                '</section>'
              : '<section class="viewer-panel"><h2>작성 안내</h2>' +
              '<p style="line-height:1.7;color:var(--ink-2);">현재 <strong>xlsx</strong> 양식(Rev1 초보자 O/X)으로 운영 중입니다. HTML 전환 예정.</p>' +
              '<div class="viewer-notice" style="margin-top:12px;">정본: FSSC 기록양식(Form)</div></section>') +
            '<section class="viewer-panel"><h2>같은 절차서의 다른 양식</h2><div id="siblingForms">…</div></section>';

          if (procs[0]) {
            DkjLinks.recordsForProcedure(procs[0].id).then(function (siblings) {
              var chips = siblings.filter(function (s) { return s.id !== id; }).map(function (s) {
                return '<a class="link-chip" href="record-viewer.html?id=' + encodeURIComponent(s.id) + '">' + s.code + '</a>';
              }).join('') || '<span class="doc-tag">없음</span>';
              document.getElementById('siblingForms').innerHTML = chips;
            });
          }
        });
      });
    })();
  </script>
  <script src="js/dkj-pwa.js?v=23"></script>
</body>
</html>
