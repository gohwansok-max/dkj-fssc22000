  <style>
    .official-head{padding:28px 0 18px;display:flex;gap:22px;justify-content:space-between;align-items:flex-end}.official-head h1{margin:0;font-size:30px;color:var(--ink)}.official-head p{margin:7px 0 0;color:var(--ink-3)}.official-stat{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.official-stat span{padding:7px 10px;border-radius:999px;background:var(--nh-green-50);color:var(--nh-green-dark);font-size:12px;font-weight:800;white-space:nowrap}.official-note{display:flex;gap:12px;align-items:flex-start;padding:15px 17px;margin:0 0 18px;border:1px solid #badbc6;background:#f1fbf5;border-radius:14px;color:#1c5135;line-height:1.55}.official-note strong{color:#075d35}.official-tools{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.official-tools input,.official-tools select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;font:14px inherit;color:var(--ink)}.official-tools input:focus,.official-tools select:focus{outline:3px solid rgba(0,154,68,.14);border-color:var(--nh-green)}.official-count{margin:14px 2px 9px;color:var(--ink-3);font-size:13px}.official-list{display:grid;gap:10px;padding-bottom:60px}.official-row{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:center;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 2px 7px rgba(18,51,35,.025)}.official-main{min-width:0}.official-title{display:flex;gap:8px;align-items:flex-start}.official-title h2{margin:0;font-size:15px;line-height:1.48;color:var(--ink);word-break:break-word}.official-code{flex:0 0 auto;border-radius:6px;background:#eef6f1;color:#09683d;padding:3px 6px;font-size:11px;font-weight:800;line-height:1.35}.official-path{margin:7px 0 0;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.official-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}.format-badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#eef2ff;color:#3c4a94;font-size:11px;font-weight:800}.format-badge.pdf{background:#fff1f1;color:#aa2b28}.format-badge.hwp{background:#f4efff;color:#6541a3}.format-badge.xlsx,.format-badge.xls{background:#edf9f1;color:#167245}.format-badge.docx{background:#edf4ff;color:#265c9a}.format-badge.pptx,.format-badge.ppt{background:#fff4e9;color:#a35313}.pdf-paired{color:#147243;font-size:12px;font-weight:700}.official-actions{display:grid;grid-template-columns:88px 108px 82px;gap:6px;align-items:center;justify-content:end;width:290px;flex-shrink:0}.official-actions .pill-btn{width:100%;height:38px;min-height:38px;font-size:12px;font-weight:700;padding:0 4px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-align:center;box-sizing:border-box}.empty-docs{padding:40px 16px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink-3);background:var(--card)}@media(max-width:780px){.official-head{display:block;padding:20px 0 14px}.official-head h1{font-size:25px}.official-stat{justify-content:flex-start;margin-top:12px}.official-tools{grid-template-columns:1fr}.official-row{grid-template-columns:1fr}.official-actions{width:100%;grid-template-columns:repeat(3,1fr);justify-content:stretch}.official-actions .pill-btn{text-align:center}.official-path{white-space:normal;overflow:visible}.official-note{font-size:13px}}
  </style>

  <main class="ck-main">
    <section class="official-head">
      <div><h1>정본 문서 열람실</h1><p>승인된 Google Drive 원본과 PDF 변환본을 검색해 열람·다운로드·인쇄합니다.</p></div>
      <div class="official-stat" id="officialStats" aria-label="문서 현황"></div>
    </section>
    <section class="official-note"><span aria-hidden="true">✓</span><div><strong>심사·현장 출력은 PDF 정본을 우선 사용하세요.</strong> Word·PowerPoint·Excel·HWP는 원본 다운로드용입니다. 인쇄 버튼을 누르면 Drive 미리보기에서 인쇄할 문서가 새 탭으로 열립니다.</div></section>
    <section class="official-tools" aria-label="정본 문서 검색">
      <input id="documentSearch" type="search" placeholder="문서번호, 제목, 폴더명 검색…" autocomplete="off" aria-label="정본 문서 검색">
      <select id="typeFilter" aria-label="파일 형식 선택"><option value="all">모든 파일 형식</option><option value="pdf">PDF</option><option value="docx">Word</option><option value="pptx">PowerPoint</option><option value="xlsx">Excel</option><option value="hwp">HWP</option></select>
    </section>
    <p class="official-count" id="documentCount">문서를 불러오는 중입니다.</p>
    <section class="official-list" id="documentList" aria-live="polite"></section>
