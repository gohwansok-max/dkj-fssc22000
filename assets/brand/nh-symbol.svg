<!--
  농협 심볼(노랑) — 원본 로고 이미지를 보고 기하학적으로 재현한 것이다.
  공식 원본 파일이 아니므로, 대외로 나가는 인쇄물·문서에는 정식 로고 파일을 쓴다.
  교체할 때는 이 파일을 지우고 assets/brand/nh-symbol.png 를 넣은 뒤
  HTML 7곳의 참조(.svg → .png)를 되돌리면 된다.

  구성 — 훈장(메달)과 리본 형태
    · 아래: 두꺼운 링(바깥 반지름 632.5, 안쪽 310, 중심 632.5,967.5)
    · 위: 좌우 두 개의 리본 날개가 바깥 위로 뻗는다
    · 가운데: 두 날개 사이의 흰 쐐기가 링의 안쪽 원 꼭대기(632.5, 657.5)까지 파고든다
  전체 좌표계는 1265×1600, viewBox 는 정사각형이 되도록 좌우에 167.5씩 여백을 준다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-167.5 0 1600 1600" role="img" aria-label="농협 심볼">
  <path fill="#FFC72C" fill-rule="evenodd" d="
    M 632.5 657.5
    L 355 0
    L 0 78
    L 0 390
    L 242 470
    A 632.5 632.5 0 1 0 1023 470
    L 1265 390
    L 1265 78
    L 910 0
    Z
    M 942.5 967.5
    A 310 310 0 1 0 322.5 967.5
    A 310 310 0 1 0 942.5 967.5
    Z
  "/>
</svg>
