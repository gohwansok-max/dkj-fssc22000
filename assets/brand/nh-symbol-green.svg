  <path fill="#009A44" fill-rule="evenodd" d="
    M 632.5 657.5
    L 355 0
    L 0 78
    L 0 390
    L 242 470
    A 632.5 632.5 0 1 0 1023 470
    L 1265 390
    L 1265 78
    L 910 0
    Z
    M 942.5 967.5
    A 310 310 0 1 0 322.5 967.5
    A 310 310 0 1 0 942.5 967.5
