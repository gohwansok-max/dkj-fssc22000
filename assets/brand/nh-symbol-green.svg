<!--
  농협 심볼(녹색) — nh-symbol.svg 와 같은 도형이고 색만 다르다.
  워드마크(심볼+사업장명)처럼 흰 바탕 위에 얹을 때 쓴다.
  도형을 고칠 때는 nh-symbol.svg 와 함께 고쳐야 한다 — 두 파일이 같은 path 를 복제하고 있다
  (<img> 로 불러 쓰므로 CSS 변수나 currentColor 로는 색을 바꿀 수 없어 파일을 나눴다).
-->
