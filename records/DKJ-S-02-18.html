<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>DKJ-S-02-18 운송차량 위생점검표 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-tokens.css?v=100">
  <link rel="stylesheet" href="../css/dkj-form.css?v=100">
  <link rel="stylesheet" href="../css/dkj-print.css?v=100">
  <link rel="manifest" href="../manifest.json?v=100">

</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>DKJ-S-02-18 운송차량 위생점검표</h1>
        <p>선행요건 · 출하/회차 · 차량 위생 O/X · 1일 2대</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill-btn ghost" href="../records-center.html?cat=daily">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=PRP-006">PRP-006</a>
      </div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 일보</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    
    <section class="dkj-panel">
      <h2>① 점검 기본정보</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field"><label for="checkDate">점검일자 *</label><input type="date" id="checkDate"></div><div class="dkj-field full" style="margin:2px 0 -8px;"><strong style="font-size:13px;color:var(--nh-green,#009a44);">🚚 차량 1</strong></div><div class="dkj-field"><label for="vehicleNo1">차량1 번호 *</label><select id="vehicleNo1"><option value="">-- 차량번호 선택 --</option><option value="__register__">+ 새 차량번호 등록</option></select></div><div class="dkj-field"><label for="destination1">차량1 행선/용도</label><select id="destination1"><option value="">선택</option><option value="출하">출하</option><option value="회수">회수</option></select></div><div class="dkj-field"><label for="arrivalPlace1">차량1 도착지</label><select id="arrivalPlace1"><option value="">선택</option><option value="양산">양산</option><option value="오산">오산</option></select></div><div class="dkj-field"><label for="departTime1">차량1 출발시간</label><input type="time" id="departTime1"></div><div class="dkj-field"><label for="arriveTime1">차량1 도착시간</label><input type="time" id="arriveTime1"></div><div class="dkj-field full" style="margin:2px 0 -8px;"><strong style="font-size:13px;color:var(--nh-green,#009a44);">🚚 차량 2</strong></div><div class="dkj-field"><label for="vehicleNo2">차량2 번호 *</label><select id="vehicleNo2"><option value="">-- 차량번호 선택 --</option><option value="__register__">+ 새 차량번호 등록</option></select></div><div class="dkj-field"><label for="destination2">차량2 행선/용도</label><select id="destination2"><option value="">선택</option><option value="출하">출하</option><option value="회수">회수</option></select></div><div class="dkj-field"><label for="arrivalPlace2">차량2 도착지</label><select id="arrivalPlace2"><option value="">선택</option><option value="양산">양산</option><option value="오산">오산</option></select></div><div class="dkj-field"><label for="departTime2">차량2 출발시간</label><input type="time" id="departTime2"></div><div class="dkj-field"><label for="arriveTime2">차량2 도착시간</label><input type="time" id="arriveTime2"></div>
      </div>
    </section>
    <section class="dkj-panel">
      <h2>② 차량위생 O/X (차량 1 · 차량 2) <span style="font-weight:500;color:#888;font-size:12px;">(O 적합 · X 부적합 · - 해당없음)</span></h2>
      <div class="ox-grid" id="oxGrid"></div>
    </section>
    <section class="dkj-panel">
      <h2>③ 판정·시정</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정 *</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">부적합 시 즉시조치</label>
          <textarea id="corrective" placeholder="내용·조치자·완료시각"></textarea></div>
        <div class="dkj-field"><label for="inspector">점검자 *</label><input type="text" id="inspector" placeholder=""></div><div class="dkj-field"><label for="confirmer">확인자</label><input type="text" id="confirmer" placeholder=""></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar">
        <a class="link-chip sm" href="../doc-viewer.html?id=DKJ-S-02-18">일지 정본</a><a class="link-chip sm" href="../doc-viewer.html?id=PRP-006">PRP-006 보관·운송</a>
      </div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>④ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>

  <script src="../js/dkj-nav-bar.js?v=100"></script>
  <script src="../js/dkj-record-store.js?v=100"></script>
  <script src="../js/dkj-deeplink.js?v=100"></script>
  <script src="../js/dkj-approval.js?v=100"></script>
  
  <script src="../js/dkj-print-form.js?v=100"></script>
  <script src="../js/dkj-print-official.js?v=100"></script>
  <script src="../js/dkj-ox-form.js?v=100"></script>
  <script src="../js/DKJ-S-02-18.js?v=100"></script>
  <script src="../js/dkj-pwa.js?v=100"></script>
  <script src="../js/dkj-quick-nav.js?v=100"></script>
  <script src="../js/dkj-i18n.js?v=100"></script>
  <script src="../js/dkj-accessibility.js?v=100"></script>
</body>
</html>
