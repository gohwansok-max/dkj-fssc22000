  <title>FR-021 시정조치 요구서(CAR) | 동김제농협</title>

  <link rel="stylesheet" href="../css/dkj-print.css?v=77">
  <link rel="manifest" href="../manifest.json?v=77">
  <link rel="stylesheet" href="../css/dkj-quick-nav.css?v=77">
  <link rel="stylesheet" href="../css/dkj-accessibility.css?v=77">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>FR-021 시정조치 요구서(CAR)</h1>
        <p>FSSC22000 · 이슈</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="pill-btn ghost" href="../records-center.html?cat=car">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=DKJ-P-09">DKJ-P-09</a></div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 기록</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 기본정보</h2>
      <div class="dkj-field-grid"><div class="dkj-field"><label for="docDate">작성일자 *</label><input type="date" id="docDate" placeholder=""></div><div class="dkj-field"><label for="subject">제목 *</label><input type="text" id="subject" placeholder=""></div><div class="dkj-field"><label for="source">발생원</label><select id="source"><option value="내부심사">내부심사</option><option value="이탈" selected>이탈</option><option value="고객불만">고객불만</option><option value="기타">기타</option></select></div><div class="dkj-field"><label for="dueDate">조치기한</label><input type="date" id="dueDate" placeholder=""></div><div class="dkj-field"><label for="owner">조치책임자</label><input type="text" id="owner" placeholder=""></div><div class="dkj-field"><label for="status">상태</label><select id="status"><option value="접수" selected>접수</option><option value="조치중">조치중</option><option value="완료">완료</option><option value="유효성확인">유효성확인</option></select></div><div class="dkj-field"><label for="writer">작성자 *</label><input type="text" id="writer" placeholder=""></div><div class="dkj-field"><label for="reviewer">검토자</label><input type="text" id="reviewer" placeholder=""></div><div class="dkj-field"><label for="approver">승인자</label><input type="text" id="approver" placeholder=""></div></div>
    </section>
    
    <section class="dkj-panel">
      <h2>② 상세 내용</h2>
      <div class="dkj-field-grid"><div class="dkj-field full"><label for="problem">문제·부적합 내용</label><textarea id="problem" placeholder=""></textarea></div><div class="dkj-field full"><label for="rootCause">원인분석</label><textarea id="rootCause" placeholder=""></textarea></div><div class="dkj-field full"><label for="correctivePlan">시정·예방조치</label><textarea id="correctivePlan" placeholder=""></textarea></div><div class="dkj-field full"><label for="effectiveness">유효성 확인</label><textarea id="effectiveness" placeholder=""></textarea></div></div>
    </section>
    <section class="dkj-panel">
      <h2>③ 판정·결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합/승인</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합/반려</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">조치·후속</label>
          <textarea id="corrective" placeholder="필요 시 기재"></textarea></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar"><a class="link-chip sm" href="../doc-viewer.html?id=FR-021">문서센터</a><a class="link-chip sm" href="../doc-viewer.html?id=DKJ-P-09">DKJ-P-09</a></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>④ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>

  <script src="../js/dkj-approval.js?v=77"></script>
  <script src="../js/dkj-deeplink.js?v=77"></script>
  <script src="../js/dkj-print-official.js?v=77"></script>
  <script src="../js/dkj-print-form.js?v=77"></script>
  <script src="../js/dkj-fr-form.js?v=77"></script>
  <script src="../js/FR-021.js?v=77"></script>
  <script src="../js/dkj-pwa.js?v=77"></script>
  <script src="../js/dkj-quick-nav.js?v=77"></script>
  <script src="../js/dkj-i18n.js?v=77"></script>
  <script src="../js/dkj-accessibility.js?v=77"></script>
</body>
</html>
