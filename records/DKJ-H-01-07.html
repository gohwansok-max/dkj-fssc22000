<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>DKJ-H-01-07 검증 결과 보고서 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-tokens.css?v=13">
  <link rel="stylesheet" href="../css/dkj-form.css?v=13">
  <link rel="stylesheet" href="../css/dkj-matrix.css?v=13">
  <link rel="stylesheet" href="../css/dkj-print.css?v=13">
  <link rel="manifest" href="../manifest.json?v=13">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div><h1>DKJ-H-01-07 검증 결과 보고서</h1><p>HACCP · 검증 실시 후 · 결과 보고</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill-btn ghost" href="../records-center.html?cat=daily">← 기록목록</a>
      </div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 보고서</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field"><label for="writer">작성 *</label><input type="text" id="writer"></div>
        <div class="dkj-field"><label for="reviewer">검토</label><input type="text" id="reviewer"></div>
        <div class="dkj-field"><label for="approver">승인</label><input type="text" id="approver"></div>
      </div>
    </section>
    <section class="dkj-panel">
      <h2>② 보고 내용</h2>
      <div id="reportBlocks"></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>③ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-firebase-config.js?v=13"></script>
  <script src="../js/dkj-auth.js?v=13"></script>
  <script src="../js/dkj-cloud-sync.js?v=13"></script>
  <script src="../js/dkj-nav-bar.js?v=13"></script>
  <script src="../js/dkj-record-store.js?v=13"></script>
  <script src="../js/dkj-deeplink.js?v=13"></script>
  <script src="../js/dkj-approval.js?v=13"></script>
  <script src="../js/dkj-report-print.js?v=13"></script>
  <script src="../js/dkj-report-form.js?v=13"></script>
  <script src="../js/DKJ-H-01-07.js?v=13"></script>
  <script src="../js/dkj-pwa.js?v=13"></script>
</body>
</html>
