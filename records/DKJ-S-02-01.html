<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>DKJ-S-02-01 작업장 위생점검 일지 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-tokens.css?v=52">
  <link rel="stylesheet" href="../css/dkj-form.css?v=52">
  <link rel="stylesheet" href="../css/dkj-matrix.css?v=52">
  <link rel="stylesheet" href="../css/dkj-print.css?v=52">
  <link rel="manifest" href="../manifest.json?v=52">
  <link rel="stylesheet" href="../css/dkj-quick-nav.css?v=52">
  <link rel="stylesheet" href="../css/dkj-accessibility.css?v=52">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>DKJ-S-02-01 작업장 위생점검 일지</h1>
        <p>선행요건 · 매일 점검 · 주 단위 결재 · 35항목 × 6일 · PRP-001/002 연계</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill-btn ghost" href="../records-center.html?cat=daily">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=PRP-001">PRP-001</a>
      </div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 주차</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>

    <section class="dkj-panel">
      <h2>① 점검 주차 · 결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field"><label for="weekStart">점검 주차 시작일(월) *</label><input type="date" id="weekStart"></div>
        <div class="dkj-field"><label>점검 기간</label><div class="mxf-range" id="weekRange">—</div></div>
        <div class="dkj-field"><label for="writer">작성 *</label><input type="text" id="writer" placeholder="점검자"></div>
        <div class="dkj-field"><label for="reviewer">검토</label><input type="text" id="reviewer" placeholder="HACCP팀장"></div>
        <div class="dkj-field"><label for="approver">승인</label><input type="text" id="approver" placeholder="센터장"></div>
      </div>
      <p class="mxf-hint">※ 종이 정본과 동일하게 <strong>1장 = 1주(월~토 6일)</strong> 이며, 결재는 주 단위로 실시합니다.</p>
    </section>

    <section class="dkj-panel">
      <h2>② 위생점검 <span style="font-weight:500;color:#888;font-size:12px;">(셀을 누르면 ○ → × → — → 공란 순환)</span></h2>
      <div class="mxf-toolbar">
        <div class="mxf-summary" id="mxSummary"></div>
        <div class="mxf-quick">
          <select id="fillDay" aria-label="일괄 입력 대상일"></select>
          <button type="button" class="pill-btn ghost" id="btnFillO">해당일 미입력 전체 ○</button>
        </div>
      </div>
      <div class="mxf-scroll" id="matrixGrid"></div>
    </section>

    <section class="dkj-panel">
      <h2>③ 이상 발생 내역 <span style="font-weight:500;color:#888;font-size:12px;">(× 판정 시 필수)</span></h2>
      <div class="mxf-scroll" id="incidentGrid"></div>
      <div class="dkj-field full" style="margin-top:12px;"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      <div class="dkj-link-bar">
        <a class="link-chip sm" href="../doc-viewer.html?id=DKJ-S-02-01">일지 정본</a><a class="link-chip sm" href="../doc-viewer.html?id=PRP-001">PRP-001 영업장</a><a class="link-chip sm" href="../doc-viewer.html?id=PRP-002">PRP-002 위생</a><a class="link-chip sm" href="DKJ-H-01-01.html">CCP-1BC →</a>
      </div>
    </section>

    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>④ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-util.js?v=52"></script>
  <script src="../js/dkj-firebase-config.js?v=52"></script>
  <script src="../js/dkj-auth.js?v=52"></script>
  <script src="../js/dkj-cloud-sync.js?v=52"></script>
  <script src="../js/dkj-nav-bar.js?v=52"></script>
  <script src="../js/dkj-record-store.js?v=52"></script>
  <script src="../js/dkj-deeplink.js?v=52"></script>
  <script src="../js/dkj-approval.js?v=52"></script>
  <script src="../js/dkj-matrix-print.js?v=52"></script>
  <script src="../js/dkj-matrix-form.js?v=52"></script>
  <script src="../js/DKJ-S-02-01.js?v=52"></script>
  <script src="../js/dkj-pwa.js?v=52"></script>
  <script src="../js/dkj-quick-nav.js?v=52"></script>
  <script src="../js/dkj-accessibility.js?v=52"></script>
</body>
</html>
