<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>DKJ-S-02-09 세척 소독제 관리대장 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-tokens.css?v=28">
  <link rel="stylesheet" href="../css/dkj-form.css?v=28">
  <link rel="stylesheet" href="../css/dkj-matrix.css?v=28">
  <link rel="stylesheet" href="../css/dkj-print.css?v=28">
  <link rel="manifest" href="../manifest.json?v=28">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div><h1>DKJ-S-02-09 세척 소독제 관리대장</h1><p>선행요건 · 일자별 재고 관리 · 월 단위 시트</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill-btn ghost" href="../records-center.html?cat=daily">← 기록목록</a>
      </div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 시트</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 기본정보 · 결재</h2>
      <div class="dkj-field-grid" id="infoFields"></div>
      <div class="dkj-field-grid" style="margin-top:10px;">
        <div class="dkj-field"><label for="writer">작성 *</label><input type="text" id="writer"></div>
        <div class="dkj-field"><label for="reviewer">검토</label><input type="text" id="reviewer"></div>
        <div class="dkj-field"><label for="approver">승인</label><input type="text" id="approver"></div>
      </div>
    </section>
    <section class="dkj-panel">
      <h2>② 기록 <span style="font-weight:500;color:#888;font-size:12px;">(건별로 행을 추가하세요)</span></h2>
      <div class="mxf-toolbar"><div></div>
        <div class="mxf-quick"><button type="button" class="pill-btn ghost" id="btnAddRow">　</button></div>
      </div>
      <div class="mxf-scroll" id="ledgerGrid"></div>
      <div class="dkj-field full" style="margin-top:12px;"><label for="remark">비고</label><textarea id="remark"></textarea></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>③ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-firebase-config.js?v=28"></script>
  <script src="../js/dkj-auth.js?v=28"></script>
  <script src="../js/dkj-cloud-sync.js?v=28"></script>
  <script src="../js/dkj-nav-bar.js?v=28"></script>
  <script src="../js/dkj-record-store.js?v=28"></script>
  <script src="../js/dkj-deeplink.js?v=28"></script>
  <script src="../js/dkj-approval.js?v=28"></script>
  <script src="../js/dkj-ledger-print.js?v=28"></script>
  <script src="../js/dkj-ledger-form.js?v=28"></script>
  <script src="../js/DKJ-S-02-09.js?v=28"></script>
  <script src="../js/dkj-pwa.js?v=28"></script>
</body>
</html>
