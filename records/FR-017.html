<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>FR-017 모의회수 훈련 결과보고서</h1>
        <p>FSSC22000 · 연간</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="pill-btn ghost" href="../records-center.html?cat=recall">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=DKJ-P-06">DKJ-P-06</a></div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 기록</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 기본정보</h2>
      <div class="dkj-field-grid"><div class="dkj-field"><label for="docDate">작성일자 *</label><input type="date" id="docDate" placeholder=""></div><div class="dkj-field"><label for="subject">훈련명 *</label><input type="text" id="subject" placeholder=""></div><div class="dkj-field"><label for="drillDate">실시일</label><input type="date" id="drillDate" placeholder=""></div><div class="dkj-field"><label for="scenario">시나리오</label><input type="text" id="scenario" placeholder=""></div><div class="dkj-field"><label for="participants">참석인원</label><input type="number" id="participants" placeholder=""></div><div class="dkj-field"><label for="writer">작성자 *</label><input type="text" id="writer" placeholder=""></div><div class="dkj-field"><label for="reviewer">검토자</label><input type="text" id="reviewer" placeholder=""></div><div class="dkj-field"><label for="approver">승인자</label><input type="text" id="approver" placeholder=""></div></div>
    </section>
    
    <section class="dkj-panel">
      <h2>② 점검·평가 O/X <span style="font-weight:500;color:#888;font-size:12px;">(O 적합 · X 부적합 · - 해당없음)</span></h2>
      <div class="ox-grid" id="oxGrid"></div>
    </section>
    <section class="dkj-panel">
      <h2>③ 상세 내용</h2>
      <div class="dkj-field-grid"><div class="dkj-field full"><label for="process">훈련 진행 내용</label><textarea id="process" placeholder=""></textarea></div><div class="dkj-field full"><label for="findings">발견사항·개선점</label><textarea id="findings" placeholder=""></textarea></div><div class="dkj-field full"><label for="followup">후속조치</label><textarea id="followup" placeholder=""></textarea></div></div>
    </section>
    <section class="dkj-panel">
      <h2>④ 판정·결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합/승인</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합/반려</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">조치·후속</label>
          <textarea id="corrective" placeholder="필요 시 기재"></textarea></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar"><a class="link-chip sm" href="../doc-viewer.html?id=FR-017">문서센터</a><a class="link-chip sm" href="../doc-viewer.html?id=DKJ-P-06">DKJ-P-06</a></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>⑤ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>

  <script src="../js/dkj-print-form.js?v=53"></script>
  <script src="../js/dkj-fr-form.js?v=53"></script>
  <script src="../js/FR-017.js?v=53"></script>
  <script src="../js/dkj-pwa.js?v=53"></script>
  <script src="../js/dkj-quick-nav.js?v=53"></script>
  <script src="../js/dkj-accessibility.js?v=53"></script>
</body>
