<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#008352">
  <title>DKJ-S-02-02 조도점검일지 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-portal.css">
  <link rel="stylesheet" href="../css/dkj-form.css">
  <link rel="stylesheet" href="../css/dkj-print.css">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>DKJ-S-02-02 조도점검일지</h1>
        <p>선행요건 · 월간 · 작업장 조도(lx) 측정</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill-btn ghost" href="../records-center.html?cat=daily" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=PRP-001" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);">PRP-001</a>
      </div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 일보</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <div class="viewer-notice" style="margin-bottom:14px;"><strong>안내</strong> — 관리기준(임시) — 작업구역 일반조명 ≥200 lx · 검사·정밀작업 ≥500 lx (현장기준서로 확정)</div>
    <section class="dkj-panel">
      <h2>① 점검 기본정보</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field"><label for="checkDate">점검일자 *</label><input type="date" id="checkDate"></div><div class="dkj-field"><label for="inspector">점검자 *</label><input type="text" id="inspector" placeholder=""></div><div class="dkj-field"><label for="confirmer">확인자</label><input type="text" id="confirmer" placeholder=""></div><div class="dkj-field"><label for="instrument">조도계</label><input type="text" id="instrument" placeholder="기기번호·교정일"></div>
      </div>
    </section>
    <section class="dkj-panel">
      <h2>② 구역별 조도 측정</h2>
      <div class="mon-table-wrap">
        <table class="mon-table">
          <thead>
            <tr>
              <th>구역</th>
              <th>기준(lx)</th>
              <th>오전</th>
              <th>오후</th>
              <th>판정</th>
            </tr></thead>
          <tbody id="monBody"></tbody>
        </table>
      </div>
      <p id="deviationBanner" class="viewer-notice" hidden style="margin-top:12px;background:#ffebee;border-color:#ef9a9a;color:#b71c1c;">기준 이탈 — 즉시조치를 기록하세요.</p>
    </section>
    <section class="dkj-panel">
      <h2>③ 이탈조치·비고</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label for="corrective">이탈 시 즉시조치</label>
          <textarea id="corrective" placeholder="조치 내용"></textarea></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar">
        <a class="link-chip sm" href="../doc-viewer.html?id=DKJ-S-02-02">일지 정본</a><a class="link-chip sm" href="../doc-viewer.html?id=PRP-001">PRP-001</a>
      </div>
    </section>
    <section class="dkj-panel history"><h2>④ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-record-store.js"></script>
  <script src="../js/dkj-print-form.js"></script>
  <script src="../js/dkj-mon-form.js"></script>
  <script src="../js/DKJ-S-02-02.js"></script>
</body>
</html>
