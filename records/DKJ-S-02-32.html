<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#009a44">
  <title>DKJ-S-02-32 음용수 잔류염소 점검일지 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-tokens.css?v=84">
  <link rel="stylesheet" href="../css/dkj-form.css?v=84">
  <link rel="stylesheet" href="../css/dkj-print.css?v=84">
  <link rel="manifest" href="../manifest.json?v=84">
  <link rel="stylesheet" href="../css/dkj-quick-nav.css?v=84">
  <link rel="stylesheet" href="../css/dkj-accessibility.css?v=84">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>DKJ-S-02-32 음용수 잔류염소 점검일지</h1>
        <p>선행요건 · 매일</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="pill-btn ghost" href="../records-center.html?cat=daily">← 기록목록</a></div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 기록</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 기본정보</h2>
      <div class="dkj-field-grid"><div class="dkj-field"><label for="docDate">작성일자 *</label><input type="date" id="docDate" placeholder=""></div><div class="dkj-field"><label for="checkTime">점검시각</label><input type="time" id="checkTime" placeholder=""></div><div class="dkj-field"><label for="measurePoint">측정지점 *</label><input type="text" id="measurePoint" placeholder="예: 취수구, 배관말단"></div><div class="dkj-field"><label for="chlorineValue">잔류염소농도(mg/L) *</label><input type="number" step="0.01" id="chlorineValue" placeholder=""></div><div class="dkj-field"><label for="writer">작성자 *</label><input type="text" id="writer" placeholder=""></div><div class="dkj-field"><label for="reviewer">검토자</label><input type="text" id="reviewer" placeholder=""></div><div class="dkj-field"><label for="approver">승인자</label><input type="text" id="approver" placeholder=""></div></div>
      <p class="mxf-hint">※ 관리기준 — 유리잔류염소 0.2 mg/L 이상 (현장 확정 CL 적용)</p>
    </section>
    <section class="dkj-panel">
      <h2>② 판정·결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합/승인</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합/반려</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">조치·후속</label>
          <textarea id="corrective" placeholder="기준(0.2 mg/L) 미달 시 재염소 투입 등 조치 기재"></textarea></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar"><a class="link-chip sm" href="../doc-viewer.html?id=DKJ-S-02-32">문서센터</a></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>③ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-util.js?v=84"></script>
  <script src="../js/dkj-firebase-config.js?v=84"></script>
  <script src="../js/dkj-auth.js?v=84"></script>
  <script src="../js/dkj-cloud-sync.js?v=84"></script>
  <script src="../js/dkj-nav-bar.js?v=84"></script>
  <script src="../js/dkj-record-store.js?v=84"></script>
  <script src="../js/dkj-approval.js?v=84"></script>
  <script src="../js/dkj-deeplink.js?v=84"></script>
  <script src="../js/dkj-print-official.js?v=84"></script>
  <script src="../js/dkj-print-form.js?v=84"></script>
  <script src="../js/dkj-fr-form.js?v=84"></script>
  <script src="../js/DKJ-S-02-32.js?v=84"></script>
  <script src="../js/dkj-pwa.js?v=84"></script>
  <script src="../js/dkj-quick-nav.js?v=84"></script>
  <script src="../js/dkj-i18n.js?v=84"></script>
  <script src="../js/dkj-accessibility.js?v=84"></script>
</body>
</html>
