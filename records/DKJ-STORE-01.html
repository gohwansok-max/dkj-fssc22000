<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#008352">
  <title>DKJ-STORE-01 원료보관·선입선출 점검 | 동김제농협</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dkj-portal.css">
  <link rel="stylesheet" href="../css/dkj-form.css">
  <link rel="stylesheet" href="../css/dkj-print.css">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>DKJ-STORE-01 원료보관·선입선출 점검</h1>
        <p>입고 적합 후 · DKJ-W-002 · FIFO O/X</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill-btn ghost" href="../records-center.html?cat=inbound" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);">← 기록목록</a><a class="pill-btn ghost" href="FR-014.html" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3);">FR-014 입고</a>
      </div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 일보</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    
    <div class="viewer-notice" id="from014Banner" hidden style="margin-bottom:14px;background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20;">
      ✓ FR-014 적합 입고에서 연계되었습니다. 보관 위치를 지정하고 FIFO 점검을 완료하세요.
    </div>
    <div class="process-bar-wrap" style="margin-bottom:14px;">
      <div id="processBar"></div>
    </div>
    <section class="dkj-panel">
      <h2>① 점검 기본정보</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field"><label for="storeDate">보관일 *</label><input type="date" id="storeDate"></div><div class="dkj-field"><label for="from014">FR-014 연계ID</label><input type="text" id="from014" placeholder="자동"></div><div class="dkj-field"><label for="itemName">품명 *</label><input type="text" id="itemName" placeholder=""></div><div class="dkj-field"><label for="lot">LOT *</label><input type="text" id="lot" placeholder=""></div><div class="dkj-field"><label for="qty">수량</label><input type="text" id="qty" placeholder=""></div><div class="dkj-field"><label for="unit">단위</label><select id="unit"><option value="kg">kg</option><option value="박스">박스</option><option value="EA">EA</option></select></div><div class="dkj-field"><label for="supplier">공급처</label><input type="text" id="supplier" placeholder=""></div><div class="dkj-field"><label for="receiveDate">입고일</label><input type="date" id="receiveDate"></div><div class="dkj-field"><label for="location">보관장소</label><select id="location"><option value="원료냉장">원료냉장</option><option value="원료실온">원료실온</option><option value="부자재창고">부자재창고</option></select></div><div class="dkj-field"><label for="shelf">랙/위치</label><input type="text" id="shelf" placeholder=""></div><div class="dkj-field"><label for="storeTemp">보관온도(℃)</label><input type="text" id="storeTemp" placeholder=""></div><div class="dkj-field"><label for="expiry">유통기한/소비기한</label><input type="text" id="expiry" placeholder=""></div>
      </div>
    </section>
    <section class="dkj-panel">
      <h2>② 보관·FIFO O/X <span style="font-weight:500;color:#888;font-size:12px;">(O 적합 · X 부적합 · - 해당없음)</span></h2>
      <div class="ox-grid" id="oxGrid"></div>
    </section>
    <section class="dkj-panel">
      <h2>③ 판정·시정</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정 *</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">부적합 시 즉시조치</label>
          <textarea id="corrective" placeholder="내용·조치자·완료시각"></textarea></div>
        <div class="dkj-field"><label for="inspector">점검자 *</label><input type="text" id="inspector" placeholder=""></div><div class="dkj-field"><label for="confirmer">확인자</label><input type="text" id="confirmer" placeholder=""></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar">
        <a class="link-chip sm" href="FR-014.html">FR-014</a><a class="link-chip sm" href="../doc-viewer.html?id=DKJ-W-002">DKJ-W-002</a><a class="link-chip sm" href="DKJ-S-02-05.html">온습도</a>
      </div>
    </section>
    <section class="dkj-panel history"><h2>④ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-record-store.js"></script>
  <script src="../js/dkj-master-data.js"></script>
  <script src="../js/dkj-print-form.js"></script>
  <script src="../js/dkj-ox-form.js"></script>
  <script src="../js/DKJ-STORE-01.js"></script>
</body>
</html>
