<head>

  <title>FR-038 환경모니터링 결과 및 Trend표 | 동김제농협</title>

  <link rel="stylesheet" href="../css/dkj-tokens.css?v=15">
  <link rel="stylesheet" href="../css/dkj-form.css?v=15">
  <link rel="stylesheet" href="../css/dkj-print.css?v=15">
  <link rel="manifest" href="../manifest.json?v=15">
</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>FR-038 환경모니터링 결과 및 Trend표</h1>
        <p>FSSC22000 · 주간</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="pill-btn ghost" href="../records-center.html?cat=env">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=DKJ-P-16">DKJ-P-16</a></div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 기록</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 기본정보</h2>
      <div class="dkj-field-grid"><div class="dkj-field"><label for="docDate">작성일자 *</label><input type="date" id="docDate" placeholder=""></div><div class="dkj-field"><label for="subject">시료/지점 *</label><input type="text" id="subject" placeholder=""></div><div class="dkj-field"><label for="sampleDate">채취일</label><input type="date" id="sampleDate" placeholder=""></div><div class="dkj-field"><label for="zone">Zone</label><select id="zone"><option value="Zone1">Zone1</option><option value="Zone2" selected>Zone2</option><option value="Zone3">Zone3</option><option value="Zone4">Zone4</option></select></div><div class="dkj-field"><label for="result">결과</label><select id="result"><option value="음성" selected>음성</option><option value="양성">양성</option><option value="재검">재검</option></select></div><div class="dkj-field"><label for="value">수치/균종</label><input type="text" id="value" placeholder=""></div><div class="dkj-field"><label for="writer">작성자 *</label><input type="text" id="writer" placeholder=""></div><div class="dkj-field"><label for="reviewer">검토자</label><input type="text" id="reviewer" placeholder=""></div><div class="dkj-field"><label for="approver">승인자</label><input type="text" id="approver" placeholder=""></div></div>
    </section>
    
    <section class="dkj-panel">
      <h2>② 상세 내용</h2>
      <div class="dkj-field-grid"><div class="dkj-field full"><label for="trend">Trend·해석</label><textarea id="trend" placeholder=""></textarea></div><div class="dkj-field full"><label for="action">양성 시 조치</label><textarea id="action" placeholder=""></textarea></div></div>
    </section>
    <section class="dkj-panel">
      <h2>③ 판정·결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합/승인</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합/반려</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">조치·후속</label>
          <textarea id="corrective" placeholder="필요 시 기재"></textarea></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar"><a class="link-chip sm" href="../doc-viewer.html?id=FR-038">문서센터</a><a class="link-chip sm" href="../doc-viewer.html?id=DKJ-P-16">DKJ-P-16</a></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>④ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>

  <script src="../js/dkj-fr-form.js?v=15"></script>
  <script src="../js/FR-038.js?v=15"></script>
  <script src="../js/dkj-pwa.js?v=15"></script>
</body>
</html>
