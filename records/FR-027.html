  <title>FR-027 검교정 계획 및 결과표 | 동김제농협</title>

  <link rel="stylesheet" href="../css/dkj-tokens.css?v=76">

  <link rel="stylesheet" href="../css/dkj-print.css?v=76">
  <link rel="manifest" href="../manifest.json?v=76">

</head>
<body class="dkj-form-page">
  <div class="screen-only">
  <nav id="dkjNav"></nav>
  <header class="dkj-form-header">
    <div class="container">
      <div>
        <h1>FR-027 검교정 계획 및 결과표</h1>
        <p>FSSC22000 · 이슈</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><a class="pill-btn ghost" href="../records-center.html?cat=calibration">← 기록목록</a><a class="pill-btn ghost" href="../doc-viewer.html?id=DKJ-P-10">DKJ-P-10</a></div>
    </div>
  </header>
  <main class="container dkj-form-body">
    <div class="dkj-form-toolbar">
      <div class="dkj-status" id="saveStatus"><span class="dot"></span> 준비</div>
      <button type="button" class="pill-btn green" id="btnSave">저장</button>
      <button type="button" class="pill-btn blue" id="btnLock">작성완료</button>
      <button type="button" class="pill-btn ghost" id="btnNew">새 기록</button>
      <button type="button" class="pill-btn ghost" id="btnPrint">인쇄(정본)</button>
    </div>
    <section class="dkj-panel">
      <h2>① 기본정보</h2>
      <div class="dkj-field-grid"><div class="dkj-field"><label for="docDate">작성일자 *</label><input type="date" id="docDate" placeholder=""></div><div class="dkj-field"><label for="subject">계측기명 *</label><input type="text" id="subject" placeholder=""></div><div class="dkj-field"><label for="assetNo">관리번호</label><input type="text" id="assetNo" placeholder=""></div><div class="dkj-field"><label for="calDate">교정일</label><input type="date" id="calDate" placeholder=""></div><div class="dkj-field"><label for="agency">교정기관</label><input type="text" id="agency" placeholder=""></div><div class="dkj-field"><label for="result">결과</label><select id="result"><option value="합격" selected>합격</option><option value="조정후합격">조정후합격</option><option value="불합격">불합격</option></select></div><div class="dkj-field"><label for="certNo">성적서번호</label><input type="text" id="certNo" placeholder=""></div><div class="dkj-field"><label for="writer">작성자 *</label><input type="text" id="writer" placeholder=""></div><div class="dkj-field"><label for="reviewer">검토자</label><input type="text" id="reviewer" placeholder=""></div><div class="dkj-field"><label for="approver">승인자</label><input type="text" id="approver" placeholder=""></div></div>
    </section>
    
    <section class="dkj-panel">
      <h2>② 점검·평가 O/X <span style="font-weight:500;color:#888;font-size:12px;">(O 적합 · X 부적합 · - 해당없음)</span></h2>
      <div class="ox-grid" id="oxGrid"></div>
    </section>
    <section class="dkj-panel">
      <h2>③ 상세 내용</h2>
      <div class="dkj-field-grid"><div class="dkj-field full"><label for="noteDetail">불확도·조치</label><textarea id="noteDetail" placeholder=""></textarea></div></div>
    </section>
    <section class="dkj-panel">
      <h2>④ 판정·결재</h2>
      <div class="dkj-field-grid">
        <div class="dkj-field full"><label>종합판정</label>
          <div class="judge-row">
            <button type="button" class="judge-btn ok" id="judgeOk" data-judge="적합">✓ 적합/승인</button>
            <button type="button" class="judge-btn ng" id="judgeNg" data-judge="부적합">✕ 부적합/반려</button>
          </div>
        </div>
        <div class="dkj-field full"><label for="corrective">조치·후속</label>
          <textarea id="corrective" placeholder="필요 시 기재"></textarea></div>
        <div class="dkj-field full"><label for="remark">비고</label><textarea id="remark"></textarea></div>
      </div>
      <div class="dkj-link-bar"><a class="link-chip sm" href="../doc-viewer.html?id=FR-027">문서센터</a><a class="link-chip sm" href="../doc-viewer.html?id=DKJ-P-10">DKJ-P-10</a></div>
    </section>
    <section class="dkj-panel">
      <h2>전자결재 · 감사이력</h2>
      <div id="approvalPanel"></div>
    </section>
    <section class="dkj-panel history"><h2>⑤ 최근 저장</h2><div id="historyList"></div></section>
  </main>
  </div>
  <div id="printSheet" class="print-sheet" aria-hidden="true"></div>
  <script src="../js/dkj-util.js?v=76"></script>

  <script src="../js/dkj-deeplink.js?v=76"></script>
  <script src="../js/dkj-print-official.js?v=76"></script>
  <script src="../js/dkj-print-form.js?v=76"></script>
  <script src="../js/dkj-fr-form.js?v=76"></script>
  <script src="../js/FR-027.js?v=76"></script>
  <script src="../js/dkj-pwa.js?v=76"></script>
  <script src="../js/dkj-quick-nav.js?v=76"></script>
  <script src="../js/dkj-i18n.js?v=76"></script>
  <script src="../js/dkj-accessibility.js?v=76"></script>
</body>
</html>
