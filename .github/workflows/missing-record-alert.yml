name: 일지 미작성 알림

# 이 앱은 서버가 없다 — 그래서 화면을 아무도 열어놓지 않아도 "아직도 안 썼다"는
# 걸 알아채려면 바깥에서 주기적으로 찔러주는 게 필요하다. 이 워크플로가 그 역할.
# 09~23시(KST) 매시 정각에 scripts/notify_missing_records.py 를 돌려 RTDB를 REST로
# 직접 읽고(이미 열려 있는 경로만 사용, 별도 비밀값 불필요), 마감이 지난 미작성
# 서식이 있으면 기존 불편접수용 텔레그램 봇/챗으로 알림을 보낸다.
# 자세한 판정 기준·마감 시각·재알림 주기는 scripts/notify_missing_records.py 상단
# 설명과 docs/MISSING_RECORD_ALERT.md 참고.

on:
  schedule:
    # 00:00~14:00 UTC = 09:00~23:00 KST, 매시 정각
    - cron: '0 0-14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제로 텔레그램을 보내지 않고 콘솔에만 출력'
        type: boolean
        default: true
      test_send:
        description: '마감·미작성 여부와 무관하게 텔레그램 테스트 메시지 1건만 발송(연결 확인용). 켜면 dry_run 설정과 무관하게 실제 발송됨'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 미작성 서식 확인 및 알림
        env:
          # 스케줄 실행은 항상 실제 발송. 수동 실행(workflow_dispatch)은 기본 dry-run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          TEST_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.test_send || 'false' }}
        run: python3 scripts/notify_missing_records.py
