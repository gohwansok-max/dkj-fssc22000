name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # 프리캐시 목록을 배포 때마다 다시 만든다. 커밋된 sw-precache.js 가 옛것이면
      # 태블릿이 바뀐 파일을 안 받아간다 — 사람이 스크립트 돌리는 걸 잊어도 되게 한다.
      - name: 서비스워커 프리캐시 목록 생성
        run: python3 scripts/build-sw-precache.py
      # 사내 도구/문서는 공개 사이트에 올리지 않는다 — 사이트가 fetch 하는 것은
      # data/*.json, css, js, assets, records 뿐이고 scripts/·functions/(Firebase
      # Cloud Functions 서버 코드)·tests/(마이그레이션 검증용 샘플)는 참조하지 않는다
      - name: Stage site (내부 파일 제외)
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'functions' \
            --exclude 'tests' \
            --exclude '*.md' \
            --exclude '*.local.json' \
            ./ _site/
          echo "--- staged ---"
          ls -A _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
